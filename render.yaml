services:
  - type: web
    name: grok-tg-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-3
      - key: BOT_NAME
        value: Grok Assistant
